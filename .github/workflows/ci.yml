name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check src scripts tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install the package + dev tools ONLY (numpy/pyyaml/soundfile/pytest).
      # The heavy ML stack (torch, faster-whisper, transformers, coqui-tts) and
      # the ~6 GB of models are deliberately NOT installed: CI exercises the
      # dummy-stage path, which Phase 0 built to run on bare numpy. Real-model
      # runs happen locally / on a GPU box, not in CI.
      - name: Install core + dev deps
        run: pip install -e ".[dev]"
      - name: Unit tests (dummy path)
        run: pytest tests/ -v
      - name: End-to-end plumbing smoke (dummy stages, no models)
        run: python scripts/run_eval.py --config configs/dummy.yaml
